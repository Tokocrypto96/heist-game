<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0e13; }
  #wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; box-sizing: border-box; }
  #game { display: block; max-width: 100%; max-height: calc(100vh - 64px); width: auto; height: auto; background: #20242e; border: 2px solid #3d4457; touch-action: none; }
  #help { color: #9aa3b5; font: 13px/1.5 sans-serif; text-align: center; margin: 0; }
  #help b { color: #e8e8e8; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600" aria-label="Midnight Vault Heist: sneak past guards and cameras, crack the vault, grab the loot and escape"></canvas>
  <p id="help"><b>WASD / arrows</b> move &nbsp;·&nbsp; <b>click</b> walk to &nbsp;·&nbsp; <b>E</b> crack vault &nbsp;·&nbsp; <b>1</b> smoke bomb &nbsp;·&nbsp; <b>2</b> EMP &nbsp;·&nbsp; <b>3</b> lockpick &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; <b>R</b> retry</p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
